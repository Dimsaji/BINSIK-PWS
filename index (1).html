<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LKBB ARENA – Sistem Penilaian Paskibra</title>
<style>
:root{--bg:#3b1230;--side:#4a1a3e;--card:#fbf6ee;--ink:#2a1224;--gold:#f0b94d;--plum:#5b2350;--mut:#7a6572;--ok:#d9eedd;--okt:#25623a;--warn:#fbe7c4;--warnt:#8a5a0a;--line:#e6dccf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,Arial,sans-serif;display:flex;min-height:100vh}
aside{width:230px;background:var(--side);color:#f6e9d8;padding:22px 14px;flex:none;position:sticky;top:0;height:100vh}
.logo{text-align:center;margin-bottom:22px}.logo b{display:block;font:700 24px Georgia,serif;color:var(--gold);letter-spacing:1px}.logo span{font-size:13px;opacity:.85}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:11px 14px;border-radius:9px;font:inherit;cursor:pointer;margin-bottom:4px}
nav button.on{background:var(--gold);color:#3b1230;font-weight:600}nav button:hover:not(.on){background:#5d2650}
main{flex:1;padding:24px 28px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font:700 26px Georgia,serif;color:var(--gold)}.sub{color:#e6d3c2;font-size:14px}
.juri{background:#552048;border-radius:12px;padding:8px 12px;color:#f6e9d8;font-size:13px}.juri input{background:transparent;border:0;border-bottom:1px solid #8a5a7e;color:#fff;font:inherit;width:130px;padding:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stat{background:#552048;border-radius:12px;padding:14px 16px;color:#f6e9d8}.stat b{display:block;font-size:28px;color:#fff}.stat span{font-size:13px;opacity:.85}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:16px}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:16px}.card h2{margin:0 0 12px;font:700 18px Georgia,serif}
table{border-collapse:collapse;width:100%}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}th{font-size:12.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px}
.sc{overflow-x:auto}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;background:var(--warn);color:var(--warnt)}.badge.ok{background:var(--ok);color:var(--okt)}
.btn{background:var(--plum);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-size:13.5px;cursor:pointer}.btn.g{background:var(--gold);color:#3b1230;font-weight:600}.btn.l{background:#eadfd2;color:var(--ink)}.btn:hover{filter:brightness(1.1)}
input,select{font:inherit;padding:8px 10px;border:1px solid #d6c8b8;border-radius:8px;background:#fff;color:var(--ink);max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.f td.c,.f th.c{text-align:center;padding:4px 2px}.f th.grp{background:#efe4d4;color:var(--ink);text-transform:none;font-size:13px}
.chip{min-width:34px;padding:5px 0;border:1px solid #cdbfae;background:#fff;border-radius:7px;cursor:pointer;font:inherit;font-size:13.5px;color:var(--ink)}
.chip.C{background:#fff6e0}.chip.B{background:#e8f4ea}.chip.S{background:#e6eefc}.chip.K{background:#fde7e4}
.chip.sel{background:var(--plum);color:#fff;border-color:var(--plum);font-weight:700}
.tot{display:flex;gap:18px;flex-wrap:wrap;font-weight:600;margin:10px 0}
.ph{display:none;text-align:center;margin-bottom:10px}.ph h3{margin:0;font-size:17px}.ph p{margin:2px 0}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.meta div{flex:1;min-width:160px;border:1px solid var(--line);padding:6px 8px;border-radius:6px;font-size:14px}
.muted{color:var(--mut);font-size:13px}
@media(max-width:820px){body{display:block}aside{width:auto;height:auto;position:static;padding:12px}.logo{margin-bottom:8px}nav{display:flex;gap:4px;overflow-x:auto}nav button{white-space:nowrap;width:auto}main{padding:16px 12px}.grid{grid-template-columns:1fr}}
.mh{display:none}.sig,.po{display:none}.chip:disabled{cursor:not-allowed;opacity:.9}.ph img{display:block;margin:0 auto 4px}.logo img{display:block;margin:0 auto 6px}
@media(max-width:820px){.f,.f tbody{display:block}.f tr.hd{display:none}.f tr.it{display:block;padding:8px 0;border-bottom:1px solid var(--line)}.f tr.it td{display:inline-block;border:0;padding:3px 2px}.f td.nm{display:block;font-weight:600;padding:2px 0 6px}.f td.no,.f td.e{display:none}.f tr:has(th){display:block}.f th.grp{display:block;margin-top:8px}.chip{min-width:42px;height:42px;font-size:15px}.mh{display:block;margin:14px 0 4px}.logo{display:flex;align-items:center;gap:10px;justify-content:center}.logo img{width:46px!important;height:46px!important;margin:0}.logo b{font-size:19px}.logo span{display:none}.juri{width:100%}}
@media print{
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{background:#fff;display:block;color:#000}aside,.top,.noprint,.btn,.row,.stats{display:none!important}
 main{padding:0}.card{background:#fff;padding:0;margin:0;border-radius:0}.ph{display:block}
 th,td{font-size:11px;padding:3px 3px;border:1px solid #888}.chip{min-width:26px;padding:2px 0;font-size:11px;border-color:#888}
 .chip:not(.sel){background:#fff}.chip.sel{background:#222;color:#fff}
 .sc{overflow:visible}tr{break-inside:avoid}.sig{display:flex;justify-content:space-between;margin:16px 30px 0;font-size:12px;line-height:1.3}.po{display:block;break-before:page}
}
</style>
</head>

<aside>

function peserta(){
 return '<div class="card"><h2>Tambah Pasukan</h2><div class="row"><input id="an" placeholder="No" style="width:70px"><input id="ap" placeholder="Nama pasukan / komandan"><input id="as" placeholder="Asal sekolah"><button class="btn g" data-add>Tambah</button></div></div><div class="card"><h2>Data Peserta</h2><div class="sc"><table><tr><th>No</th><th>Nama</th><th>Sekolah</th><th></th></tr>'+
 S.teams.map(t=>'<tr><td>'+esc(t.no)+'</td><td>'+esc(t.nama)+'</td><td>'+esc(t.sekolah)+'</td><td><button class="btn l" data-del="'+t.id+'">Hapus</button></td></tr>').join('')+'</table></div></div>'}
let LK=false;
const SIG=()=>'<div class="sig"><div>Tangerang, ................................ 2026<br><b>Pendamping Juri</b><br><br><br><br>( ................................ )</div><div><br><b>Dewan Juri</b><br><br><br><br>( '+esc(S.names[S.J]||'................................')+' )</div></div>';
function chips(it,cf){return it.v.map((v,i)=>'<td class="c"><button class="chip '+cf(i)+(it.sel===v?' sel':'')+'"'+(LK?' disabled':'')+' data-k="'+it.k+'" data-v="'+v+'">'+v+'</button></td>').join('')}
function nilai(){
 const t=S.teams.find(x=>x.id==S.sel);
 const opt='<div class="row noprint"><select id="sel"><option value="">— Pilih pasukan (kosong = lembar kosong) —</option>'+S.teams.map(x=>'<option value="'+x.id+'"'+(x.id==S.sel?' selected':'')+'>'+esc(x.no+'. '+x.nama)+'</option>').join('')+'</select><button class="btn g" data-print>Cetak / Simpan PDF</button>'+(t?(SB(t)[S.J]?'<button class="btn" data-edit>Edit Nilai</button><span class="badge ok">Sudah disubmit</span>':'<button class="btn l" data-clear>Kosongkan nilai</button><button class="btn g" data-submit>Submit Nilai</button>'):'')+'</div>';
 const sc=t?SC(t):{};LK=!!(t&&SB(t)[S.J]);let i=0;
 const rows=PBB.map(g=>'<tr><th class="grp" colspan="9">'+g[0].toUpperCase()+'</th></tr>'+g[1].map((it,j)=>{const x=PI[i++];x.sel=sc[x.k];return '<tr class="it"><td class="no">'+(j+1)+'</td><td class="nm">'+esc(x.n)+'</td>'+chips(x,c7)+'<td class="e"></td><td class="e"></td></tr>'}).join('')).join('');
 const krows=KI.map((x,j)=>{x.sel=sc[x.k];return '<tr class="it"><td class="no">'+(j+1)+'</td><td class="nm">'+esc(x.n)+'</td>'+chips(x,c9)+'</tr>'}).join('');
 const vrows=VI.map((x,j)=>{x.sel=sc[x.k];return '<tr class="it"><td class="no">'+(j+1)+'</td><td class="nm">'+esc(x.n)+'</td>'+chips(x,c7)+'<td class="e"></td><td class="e"></td></tr>'}).join('');
 return opt+'<div class="card">'+head(t)+'<div class="sc"><table class="f"><tr class="hd"><th rowspan="2">No</th><th rowspan="2">Keterangan</th><th class="c" colspan="2">Cukup (C)</th><th class="c" colspan="3">Baik (B)</th><th class="c" colspan="2">Sangat Baik (SB)</th></tr><tr class="hd"><th class="c" colspan="2"></th><th class="c" colspan="3"></th><th class="c" colspan="2"></th></tr>'+rows+'</table></div>'+
 '<h3 class="mh">Penilaian Komandan Pasukan / Danton</h3><div class="sc" style="margin-top:14px"><table class="f"><tr class="hd"><th colspan="2">Penilaian Komandan Pasukan / Danton</th><th class="c" colspan="2">Kurang</th><th class="c" colspan="2">Cukup</th><th class="c" colspan="3">Baik</th><th class="c" colspan="2">Sangat Baik</th></tr>'+krows+'</table></div>'+SIG()+'<div class="po">'+head(t,'FORMAT PENILAIAN VARIASI')+'</div><h3 class="mh">Penilaian Variasi</h3><div class="sc" style="margin-top:14px"><table class="f"><tr class="hd"><th colspan="2">Penilaian Variasi</th><th class="c" colspan="2">Cukup (C)</th><th class="c" colspan="3">Baik (B)</th><th class="c" colspan="2">Sangat Baik (SB)</th></tr>'+vrows+'</table></div>'+SIG()+
 '<div class="tot"><span>Total PBB: '+(t?sum(t,'p'):0)+' / '+MAXP+'</span><span>Total Komandan: '+(t?sum(t,'k'):0)+' / '+MAXK+'</span><span>Total Variasi: '+(t?sum(t,'v'):0)+' / '+MAXV+'</span><span>Total Juri '+(S.J+1)+': '+(t?jt(t,S.J):0)+'</span></div>'+(t?'<div class="row noprint">'+(SB(t)[S.J]?'<button class="btn" data-edit>Edit Nilai</button><span class="badge ok">Sudah disubmit</span>':'<button class="btn g" data-submit>Submit Nilai</button>')+'</div>':'')+'<p class="muted">Keterangan kategori: C = Cukup (kuning) | B = Baik (hijau) | SB = Sangat Baik (biru). Klik angka untuk memilih nilai, klik lagi untuk membatalkan.</p></div>'}
function rekap(){
 return '<div class="card"><div class="row noprint"><button class="btn g" data-print>Cetak Rekap</button><button class="btn" data-csv>Unduh Excel (CSV)</button><button class="btn" data-send>Kirim Nilai Saya</button><button class="btn" data-merge>Gabung Nilai Juri Lain</button><button class="btn l" data-json>Unduh Cadangan (JSON)</button><button class="btn l" data-reset>Reset Semua Nilai</button></div><div id="xfer" class="noprint"></div>'+
 '<div class="ph"><img class="lg" alt="" style="height:60px"><h3>REKAP NILAI &amp; PERINGKAT</h3><p><b>'+esc(S.info.lomba)+'</b> – '+esc(S.info.tempat)+'</p></div><h2>Rekap Nilai &amp; Peringkat</h2><div class="sc"><table><tr><th>Peringkat</th><th>No</th><th>Nama Pasukan</th><th>Sekolah</th><th>PBB</th><th>Komandan</th><th>Variasi</th><th>Juri 1</th><th>Juri 2</th><th>Juri 3</th><th>Nilai Akhir</th></tr>'+
 ranked().map(({t,r})=>'<tr><td><b>'+(act(t).length?r:'-')+'</b></td><td>'+esc(t.no)+'</td><td>'+esc(t.nama)+'</td><td>'+esc(t.sekolah)+'</td>'+['p','k','v'].map(p=>'<td>'+(act(t).length?av(t,p):'-')+'</td>').join('')+[0,1,2].map(j=>'<td>'+(SB(t)[j]?jt(t,j):'-')+'</td>').join('')+'<td><b>'+tot(t)+'</b></td></tr>').join('')+'</table></div><p class="muted">Nilai akhir = rata-rata total dari juri yang sudah submit (maks per juri '+(MAXP+MAXK+MAXV)+'). Juri: '+[0,1,2].map(j=>esc(S.names[j]||'Juri '+(j+1))).join(', ')+'.</p></div>'}
const TT={dash:'Selamat Datang, Juri',peserta:'Data Peserta',nilai:'Penilaian Juri',rekap:'Rekap Nilai & Peringkat'};
function render(){
 document.getElementById('nav').innerHTML=NAV.map(([k,l])=>'<button data-v="'+k+'" class="'+(S.v==k?'on':'')+'">'+l+'</button>').join('');
 document.getElementById('ttl').textContent=TT[S.v];document.getElementById('jsel').value=S.J;document.getElementById('juri').value=S.names[S.J]||'';
 document.getElementById('view').innerHTML=({dash,peserta,nilai,rekap})[S.v]();document.querySelectorAll('.lg').forEach(i=>i.src=LOGO);
}
async function dl(name,text,type){
 let d=null;try{d=await window.claude.use('downloads')}catch(e){}
 if(!d){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();return}
 try{await d.save({filename:name,data:new Blob([text],{type})})}catch(e){}
}
function csv(){
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const AI=[...PI,...KI,...VI];
 const h=['Peringkat','No','Nama Pasukan','Sekolah','PBB','Komandan','Variasi','Total Juri 1','Total Juri 2','Total Juri 3','Nilai Akhir',...[0,1,2].flatMap(j=>AI.map(x=>'J'+(j+1)+' '+x.n))];
 const rows=ranked().map(({t,r})=>[act(t).length?r:'',t.no,t.nama,t.sekolah,av(t,'p'),av(t,'k'),av(t,'v'),...[0,1,2].map(j=>SB(t)[j]?jt(t,j):''),tot(t),...[0,1,2].flatMap(j=>AI.map(x=>SC(t,j)[x.k]??''))]);
 return '\ufeff'+[h,...rows].map(r=>r.map(q).join(',')).join('\r\n');
}
const ask=(m,f)=>{const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px';o.innerHTML='<div class="card" style="max-width:340px;margin:0"><p></p><div class="row" style="margin:0"><button class="btn g" data-y>Ya</button><button class="btn l" data-n>Batal</button></div></div>';o.querySelector('p').textContent=m;o.onclick=e=>{const b=e.target.closest('button');if(!b&&e.target!==o)return;o.remove();if(b&&b.dataset.y!==undefined)f()};document.body.appendChild(o)};
const note=m=>{const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a1224;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:90%';document.body.appendChild(t);setTimeout(()=>t.remove(),3500)};
const xf=(m,x)=>document.getElementById('xfer').innerHTML='<div class="card" style="border:1px solid var(--line)"><p>'+m+'</p>'+x+'</div>';
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.v&&b.closest('nav')){S.v=d.v;render()}
 else if(d.go){S.sel=+d.go;S.v='nilai';render()}
 else if(d.k){const t=S.teams.find(x=>x.id==S.sel);if(!t){note('Pilih pasukan dulu.');return}const v=+d.v;const s=SC(t);if(s[d.k]===v)delete s[d.k];else s[d.k]=v;save();const y=scrollY;render();scrollTo(0,y)}
 else if(d.add!==undefined){const nm=document.getElementById('ap').value.trim();if(!nm)return;S.teams.push({id:Date.now(),no:document.getElementById('an').value.trim()||String(S.teams.length+1),nama:nm,sekolah:document.getElementById('as').value.trim(),sc:{}});save();render()}
 else if(d.del){const id=d.del;ask('Hapus pasukan ini beserta nilainya?',()=>{S.teams=S.teams.filter(x=>x.id!=id);save();render()})}
 else if(d.print!==undefined){try{window.print()}catch(x){note('Cetak tidak tersedia di sini. Buka lewat tab browser lalu tekan Ctrl+P.')}}
 else if(d.clear!==undefined){const t=S.teams.find(x=>x.id==S.sel);if(t)ask('Kosongkan semua nilai pasukan ini?',()=>{t.sc[S.J]={};save();render()})}
 else if(d.submit!==undefined){const t=S.teams.find(x=>x.id==S.sel);if(!t)return;const n=ALL-done(t);if(n>0){note('Masih ada '+n+' butir yang belum dinilai.');return}SB(t)[S.J]=true;save();render();note('Nilai berhasil disubmit.')}
 else if(d.edit!==undefined){const t=S.teams.find(x=>x.id==S.sel);if(t){SB(t)[S.J]=false;save();render()}}
 else if(d.send!==undefined){const o={j:S.J,name:S.names[S.J],teams:S.teams.map(t=>({no:t.no,nama:t.nama,sekolah:t.sekolah,sc:SC(t),sub:!!SB(t)[S.J]}))};xf('Salin kode ini lalu kirim ke ketua juri (misalnya lewat WhatsApp):','<textarea id="cd" readonly rows="5" style="width:100%">'+btoa(unescape(encodeURIComponent(JSON.stringify(o))))+'</textarea>');document.getElementById('cd').select()}
 else if(d.merge!==undefined)xf('Tempel kode dari juri lain:','<textarea id="cd" rows="5" style="width:100%"></textarea><button class="btn g" data-gabung>Gabung</button>')
 else if(d.gabung!==undefined){try{const o=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('cd').value.trim()))));o.teams.forEach(x=>{let t=S.teams.find(y=>y.no==x.no&&y.nama==x.nama);if(!t){t={id:Date.now()+Math.random(),no:x.no,nama:x.nama,sekolah:x.sekolah,sc:{}};S.teams.push(t)}t.sc[o.j]=x.sc;SB(t)[o.j]=!!x.sub});if(o.name)S.names[o.j]=o.name;save();render();note('Nilai Juri '+(o.j+1)+' berhasil digabung.')}catch(e){note('Kode tidak valid.')}}
 else if(d.csv!==undefined)dl('rekap-nilai-lkbb.csv',csv(),'text/csv');
 else if(d.json!==undefined)dl('cadangan-lkbb.json',JSON.stringify(S,null,2),'application/json');
 else if(d.reset!==undefined){ask('Hapus SEMUA nilai? Data pasukan tetap ada.',()=>{S.teams.forEach(t=>t.sc={});save();render()})}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id=='juri'){S.names[S.J]=t.value;save()}
 else if(t.id=='q'){S.q=t.value;const p=t.selectionStart;render();const q=document.getElementById('q');q.focus();q.setSelectionRange(p,p)}
 else if(t.dataset.info){S.info[t.dataset.info]=t.value;save()}
});
document.addEventListener('change',e=>{if(e.target.id=='jsel'){S.J=+e.target.value;save();render()}if(e.target.id=='sel'){S.sel=e.target.value?+e.target.value:null;render()}});
render();
</script>
</body>
</html>
